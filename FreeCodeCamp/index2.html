<style>
	
	.text-example {
		padding: 19px;
		margin-bottom: 30px;
		font-size: 18px;
		font-family: sans-serif;
	}

	.text.high-contrast {
		background-color: white;
		color: black;
	}

	.text-low-contrast{
		background-color: #add8ea;
		color: #dda0dd;
	}

	.label {
		font-weight: bold;
		margin-bottom: 5px;
		display: block;
	}
</style>

<div class="text-example text-hight-contrast">
	<span class="label">High Contrast Text</span>
	This is hight contrast text: black text on a white background.
</div>

<div class="text-example text-low-contrast">
	<span class="label">Low contrast text</span>
	This is low contrast text: purple text on a light blue background.
</div>
